services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pcfc_hub
      POSTGRES_USER: pcfc
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pcfc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcfc -d pcfc_hub"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pcfc_postgres:
